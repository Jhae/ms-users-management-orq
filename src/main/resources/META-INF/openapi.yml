openapi: '3.0.1'
info:
  contact:
    name: Jhonatan Arones
    email: "jhonatan98181@gmail.com"
  title: "API Manejador Usuarios"
  description: "Api para operar con usuarios del sistema"
  version: "1.1.1"


servers:
  - url: /management/ms-users-management-orq
    description: path base de producción

tags:
  - name: Users Management
    description: Operaciones solo de consulta de usuarios

paths:

  /usuarios-orq:
    post:
      operationId: createUsusarioOrq
      tags:
        - Users Management
      summary: Creacion de usuario metodo orquestado
      description: Endpoint para crear usuarios me manera orquestada
      security:
        - BearerAuth: []
      requestBody:
        description: Datos del usuario a crear
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserManagementRequestDto"
      responses:
        "201":
          description: Creacion de uuario exitoso
          content:
            application/json:
              schema:
               $ref: "#/components/schemas/UserManagementResponseDto"
        "400":
          $ref: "#/components/responses/BadRequestValidation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserManagementResponseDto:
      type: object
      description: Representacion de usuarios del sistema
      properties:
        id:
          type: integer
          format: int64
          description: id del usuario
          example: 1
        nombre:
          type: string
          description: bre completo del cliente
          example: Jhonatan
        usuario:
          type: string
          description: nombre usuario identifiacdor en el sistema
          example: jhae
        mail:
          type: string
          description: correo del ususario
          example: jhonatan98181@gmaill.com
        createdAt:
          type: string
          format: date-time
          description: fecha de creacion del usuario
          example: 2026-11-13T08:55:00-05:00
        updatedAt:
          type: string
          format: date-time
          description: fecha de actualizcion del usuario
          example: 2026-11-13T08:55:00-05:00
        notificado:
          type: boolean
          description: Indicador que informa si usuario ya fue notificado al momento de su creacion
          example: false

    UserManagementRequestDto:
      type: object
      description: Datos necesario de un nuevo usuario a crear.
      required:
        - nombre
        - contrasena
        - usuario
        - mail
      properties:
        nombre:
          type: string
          description: nombre completo del cliente
          example: Jhonatan
          minLength: 3
          pattern: "^[a-zA-Z\\s]+$"
        contrasena:
          type: string
          description: contraseña segura del cliente
          example: SW@#&ds@
          minLength: 8
          pattern: "^\\S+$"
        usuario:
          type: string
          description: el usuario identficado del usuario
          example: jhae
          minLength: 3
          pattern: "^[a-zA-Z0-9]+$"
        mail:
          type: string
          description: "el correo del usuario"
          example: jhonatan98181@gmaill.com
          format: email

    ValidationErrorResponse:
      type: object
      description: Mapa de errores de validaciones
      additionalProperties:
        type: string
      example:
        nombre: El nombre debe tener al menos 3 letras
        mail: El mail debe ser correo valido

  responses:
    BadRequestValidation:
      description: Error de validaciones de datos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    Forbidden:
      description: No autorizado (Token inválido o ausente)

    Unauthorized:
      description: "Prohibido (El token no contiene el rol requerido: ADMIN)"
    
    InternalServerError:
      description: Error interno no esperado